<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omarchy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0e14;
    color: #d7dce2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
  }

  /* ---- header: logo + wordmark, same green as the rest of this project's UI (Watch Dogs overlay, settings panel status dot) ---- */
  #logo { width: 40px; height: 40px; margin-top: 6px; opacity: 0.95; }
  h1 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #39ff88;
    text-shadow: 0 0 12px rgba(57, 255, 136, 0.35);
    margin: 8px 0 2px;
  }
  #status {
    font-size: 0.85rem;
    color: #5b6473;
    min-height: 1.3em;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ---- visualizer: same block/braille/glitch glyph mix as the desktop Watch Dogs overlay (Watchdog.qml), ported to a monospace <pre> driven by the Web Audio API instead of an RMS value piped over IPC ---- */
  #visualizerWrap {
    width: 100%;
    max-width: 480px;
    flex: 0 0 auto;
    margin: 28px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #visualizer {
    margin: 0;
    font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: clamp(1.6rem, 8vw, 2.6rem);
    letter-spacing: 0.08em;
    color: #39ff88;
    text-shadow: 0 0 18px rgba(57, 255, 136, 0.45);
    white-space: pre;
  }

  #talkBtn {
    width: 34vw;
    height: 34vw;
    max-width: 180px;
    max-height: 180px;
    min-width: 120px;
    min-height: 120px;
    border-radius: 50%;
    border: 2px solid #2a3140;
    background: radial-gradient(circle at 35% 30%, #1a2130, #0d1119);
    color: #d7dce2;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #talkBtn.live {
    border-color: #39ff88;
    box-shadow: 0 0 24px rgba(57, 255, 136, 0.25);
  }
  #talkBtn.connecting {
    border-color: #f2c744;
    box-shadow: 0 0 20px rgba(242, 199, 68, 0.2);
  }
  #talkBtn:active { transform: scale(0.97); }

  #transcript {
    width: 100%;
    max-width: 480px;
    margin-top: 24px;
    flex: 1;
    overflow-y: auto;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .line { margin-bottom: 10px; }
  .line .who {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #5b6473;
    display: block;
  }
  .line.user .who { color: #39e6ff; }
  .line.assistant .who { color: #39ff88; }

  #err {
    color: #ff5f5f;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <img id="logo" src="omarchy-logo.png" alt="">
  <h1>OMARCHY</h1>
  <div id="status">tap to talk</div>

  <div id="visualizerWrap"><pre id="visualizer"></pre></div>

  <button id="talkBtn">Talk</button>
  <div id="err"></div>
  <div id="transcript"></div>

  <audio id="remoteAudio" autoplay playsinline></audio>

<script>
const SPEAK_WINDOW_MS = 6000; // mirrors config.speak_window_seconds

const talkBtn = document.getElementById('talkBtn');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const transcriptEl = document.getElementById('transcript');
const remoteAudio = document.getElementById('remoteAudio');
const visualizerEl = document.getElementById('visualizer');

let pc = null;
let dc = null;
let localStream = null;
let handledCallIds = new Set();
let userLine = null;
let assistantLine = null;
let live = false;
let convState = 'idle'; // idle | listening | speaking — same vocabulary as watchdog.py's state()

// ---- ASCII/braille visualizer — ported from
// ~/.config/omarchy/plugins/omarchy-ai.watchdog/Watchdog.qml's
// visualizerLine()/pushLevel(), same glyph sets and mixing probabilities,
// so a phone conversation reads visually consistent with the desktop
// Watch Dogs overlay. Driven by a Web Audio AnalyserNode on the remote
// WebRTC audio track (the browser plays that audio itself — this reads
// its live amplitude, no IPC/RMS piping needed since it's all client-side).
const BLOCK_CHARS = " ▁▂▃▄▅▆▇█";
const BRAILLE_CHARS = ["⠀", "⠁", "⠃", "⠇", "⡇", "⡏", "⡟", "⡿", "⣿"];
const GLITCH_CHARS = "▓▒░╳┃╎";
const MAX_LEVELS = 10;
let levels = [];
let audioCtx = null;
let analyser = null;
let analyserData = null;

function pushLevel(v) {
  const n = isNaN(v) ? 0 : Math.max(0, Math.min(1, v));
  levels.push(n);
  if (levels.length > MAX_LEVELS) levels = levels.slice(levels.length - MAX_LEVELS);
}

function visualizerLine() {
  if (levels.length === 0) {
    let idle = '';
    for (let j = 0; j < MAX_LEVELS; j++) {
      idle += (Math.random() < 0.22 ? '⠂' : (Math.random() < 0.12 ? '⠁' : ' '));
    }
    return idle;
  }
  let s = '';
  for (let i = 0; i < levels.length; i++) {
    const idx = Math.max(0, Math.min(8, Math.round(levels[i] * 8)));
    const r = Math.random();
    if (r < 0.04 && idx > 0) {
      s += GLITCH_CHARS.charAt(Math.floor(Math.random() * GLITCH_CHARS.length));
    } else if (r < 0.62) {
      s += BRAILLE_CHARS[idx];
    } else {
      s += BLOCK_CHARS.charAt(idx);
    }
  }
  return s;
}

function setupAnalyser(remoteStream) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(remoteStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyserData = new Uint8Array(analyser.fftSize);
    source.connect(analyser);
  } catch (e) {
    console.warn('AnalyserNode setup failed', e);
  }
}

function sampleOutputLevel() {
  if (!analyser || !analyserData) return 0;
  analyser.getByteTimeDomainData(analyserData);
  let sumSquares = 0;
  for (let i = 0; i < analyserData.length; i++) {
    const v = (analyserData[i] - 128) / 128;
    sumSquares += v * v;
  }
  const rms = Math.sqrt(sumSquares / analyserData.length);
  // Headroom factor tuned by ear, same role as the desktop client's
  // OUTPUT_GAIN/12000 normalization — most speech shouldn't pin the top
  // of the scale constantly.
  return Math.min(1, rms * 5);
}

// One continuous ~10Hz loop for the whole page lifetime — matches
// visualizerLine()'s own idle-vs-real-levels branching, so there's no
// separate "idle animation" code path to keep in sync with the real one.
setInterval(() => {
  if (convState === 'speaking') {
    pushLevel(sampleOutputLevel());
  } else if (levels.length > 0) {
    levels = [];
  }
  visualizerEl.textContent = visualizerLine();
}, 100);

function setConvState(next) {
  convState = next;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  talkBtn.className = cls || '';
}

function setError(text) {
  errEl.textContent = text || '';
}

function appendTranscript(role, delta) {
  if (!delta) return;
  if (role === 'user') {
    if (!userLine) {
      userLine = document.createElement('div');
      userLine.className = 'line user';
      userLine.innerHTML = '<span class="who">You</span>';
      transcriptEl.appendChild(userLine);
    }
    userLine.append(delta);
  } else {
    if (!assistantLine) {
      assistantLine = document.createElement('div');
      assistantLine.className = 'line assistant';
      assistantLine.innerHTML = '<span class="who">Omarchy</span>';
      transcriptEl.appendChild(assistantLine);
    }
    assistantLine.append(delta);
  }
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

async function callTool(name, args) {
  try {
    const res = await fetch('/api/tool', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, arguments: args || {} }),
    });
    return await res.json();
  } catch (e) {
    return { ok: false, message: 'tool call failed: ' + e };
  }
}

function sendFunctionResult(callId, ok, message) {
  if (!dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({
    type: 'response.item.create',
    item: {
      type: 'function_call_output',
      call_id: callId,
      output: JSON.stringify({ ok, message }),
    },
  }));
  // Submitting the result doesn't make the model continue on its own —
  // same "explicit trigger needed" behavior as the desktop client.
  dc.send(JSON.stringify({ type: 'response.create' }));
}

async function checkFunctionCall(event) {
  const inner = event.event || {};
  if (inner.type !== 'response.output_item.done') return;
  const item = inner.item || {};
  if (item.type !== 'function_call') return;
  const callId = item.call_id || item.id;
  if (!callId || handledCallIds.has(callId)) return;
  handledCallIds.add(callId);

  if (item.name === 'end_conversation') {
    hangup();
    return;
  }

  let args = {};
  try { args = item.arguments ? JSON.parse(item.arguments) : {}; } catch (e) { /* leave {} */ }
  const result = await callTool(item.name, args);
  sendFunctionResult(callId, !!result.ok, result.message || '');
}

function onDataMessage(raw) {
  let event;
  try { event = JSON.parse(raw); } catch (e) { return; }
  const etype = event.type || '';
  if (etype === 'session.input_transcript.delta') {
    setStatus('listening…', 'live');
    setConvState('listening');
    assistantLine = null;
    appendTranscript('user', event.delta);
  } else if (etype === 'session.output_transcript.delta') {
    setStatus('speaking…', 'live');
    setConvState('speaking');
    userLine = null;
    appendTranscript('assistant', event.delta);
  } else if (etype === 'response.event') {
    checkFunctionCall(event);
  } else if (etype === 'response.function_call_arguments.done' && event.name === 'end_conversation') {
    hangup();
  } else if (etype === 'error') {
    const err = event.error || {};
    console.warn('gpt-live-1 error event', err);
    const code = (err.code || '').toLowerCase();
    if (code.includes('quota') || code.includes('billing')) {
      setError(err.message || 'billing/quota error');
      hangup();
    }
  }
}

async function start() {
  setError('');
  handledCallIds = new Set();
  userLine = null;
  assistantLine = null;
  transcriptEl.innerHTML = '';
  setStatus('connecting…', 'connecting');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus('tap to talk');
    setError('microphone permission denied');
    return;
  }

  // No iceServers, matching the desktop client: host candidates alone
  // have been enough there (outbound-only connection to OpenAI), and
  // skipping STUN avoids the gathering wait.
  pc = new RTCPeerConnection({ iceServers: [] });
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  pc.ontrack = (e) => {
    remoteAudio.srcObject = e.streams[0];
    setupAnalyser(e.streams[0]);
  };

  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'closed')) {
      hangup();
    }
  };

  dc = pc.createDataChannel('oai-events');
  dc.onopen = () => {
    live = true;
    setStatus('listening…', 'live');
    setConvState('listening');
    talkBtn.textContent = 'Hang up';
    // Same fixed speak-window stopgap as the desktop client, until
    // there's real VAD-based "user finished talking" detection.
    setTimeout(() => {
      if (dc && dc.readyState === 'open') {
        dc.send(JSON.stringify({ type: 'response.create' }));
      }
    }, SPEAK_WINDOW_MS);
  };
  dc.onmessage = (e) => onDataMessage(e.data);

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const check = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', check);
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(resolve, 3000); // don't hang forever if gathering stalls
    });

    const res = await fetch('/api/live/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    const { sdp } = await res.json();
    await pc.setRemoteDescription({ type: 'answer', sdp });
  } catch (e) {
    setError('connection failed: ' + e.message);
    hangup();
  }
}

function hangup() {
  live = false;
  setConvState('idle');
  if (dc) { try { dc.close(); } catch (e) {} dc = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
    localStream = null;
  }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  analyser = null;
  analyserData = null;
  remoteAudio.srcObject = null;
  setStatus('tap to talk');
  talkBtn.textContent = 'Talk';
}

talkBtn.addEventListener('click', () => {
  if (live) {
    hangup();
  } else {
    start();
  }
});

window.addEventListener('pagehide', hangup);
</script>
</body>
</html>
