[project]
name = "omarchy-ai"
version = "0.15.0"
description = "Independent voice assistant for Omarchy with Android TV/tablet casting"
authors = [
    { name = "omribenami", email = "omribenami@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    # Already resolved transitively (aiortc/pyopenssl need it) — promoted
    # to a direct dependency because src/omarchy_ai/myapi/client.py relies
    # on its Ed25519 primitives directly, not just incidentally.
    "cryptography>=42.0",
    "google-genai>=1.30.0,<3.0.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openwakeword>=0.4.0",
    "pillow>=12.3",
    "pywayland>=0.4.19",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    # cli/dashboard.py's live MyApi usage view — this project's first real
    # TUI dependency, pure-Python, no new system packages needed.
    "rich>=13.7",
    "websockets>=13.0,<17.0",
    # Browser Use's Jev-ultrafast agent. Browser decisions are routed through
    # our Gateway adapter, so it never needs a second TypeSafe/OpenRouter key.
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
    "py3langid>=0.4.0",
    "aioesphomeapi>=46.6.0",
]

[project.scripts]
omarchy-ai = "omarchy_ai:main"
# Backend for the omarchy-ai.settings Quickshell panel — see
# src/omarchy_ai/cli/settings.py's module docstring. Invoked with an
# absolute .venv/bin path from QML (same reasoning as the systemd unit's
# @VENV@/bin/python), this entry point just makes it easy to run by hand.
omarchy-ai-settings = "omarchy_ai.cli.settings:main"
# Task Runtime CLI -- see src/omarchy_ai/cli/task.py.
omarchy-ai-task = "omarchy_ai.cli.task:main"
# Tools the assistant writes for herself -- see src/omarchy_ai/cli/tools.py.
omarchy-ai-tool = "omarchy_ai.cli.tools:main"
# Live terminal dashboard for the MyApi integration — see
# src/omarchy_ai/cli/dashboard.py's module docstring.
omarchy-ai-dashboard = "omarchy_ai.cli.dashboard:main"
# MyApi token vault for programs (user tools, task commands) -- see
# src/omarchy_ai/myapi/vault.py. Values never go to a model.
omarchy-ai-vault = "omarchy_ai.myapi.vault:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage>=7.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "live: talks to a real network service (skipped in CI)",
    "hardware: needs real audio, Wayland, GPU, phone or TV hardware (skipped in CI)",
    "chaos: fault-injection test (crash, kill, hang)",
]

[tool.coverage.run]
source = ["omarchy_ai"]
branch = true

[tool.coverage.report]
skip_empty = true

# Lint and format gates start where the code already passes, so CI is green
# without a repository-wide rewrite. Widen them by fixing the debt and
# deleting entries from the ignore/exclude lists below.
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Ruff's default rule set, minus style checks the codebase does not follow
# and pyflakes findings not yet cleaned up.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Style the codebase uses on purpose.
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    # Existing debt: fix the findings, then drop the code from this list.
    "E401",
    "F401",
    "F541",
    "F841",
]

[tool.ruff.format]
# Files that predate the formatter. New files are format-checked; remove a
# file from this list in the same change that runs `ruff format` on it.
